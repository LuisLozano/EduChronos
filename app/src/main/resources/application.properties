# Fase 6, Bloque 1 - persistencia de humo.
#
# La ruta de la base NO se fija aquí. La calcula
# es.yaroki.educhronos.app.config.RutaBaseDatosEnvironmentPostProcessor (registrado en
# META-INF/spring.factories), que la sitúa en la carpeta de datos del usuario y CREA esa
# carpeta antes de que exista el DataSource: $XDG_DATA_HOME/educhronos, o
# <user.home>/.local/share/educhronos cuando la variable no está definida, que es el caso
# corriente (medido en S153 en este mismo escritorio). En Windows, %LOCALAPPDATA%\Educhronos
# y, sin esa variable, %USERPROFILE%\AppData\Local\Educhronos; esa rama está cubierta por
# test unitario, no ejecutada en Windows.
#
# Crear la carpeta es obligatorio, no una precaución: MEDIDO en S153, con el directorio
# padre ausente el arranque muere a los 1,85 s con SQLITE_CANTOPEN dentro de
# DataSourceScriptDatabaseInitializer.runScripts, sin llegar a levantar Tomcat.
#
# Para mandar sobre la ruta se arranca con --spring.datasource.url=jdbc:sqlite:<fichero>:
# si la clave ya trae valor, el post-procesador NO hace nada. De ahí viven sin tocarlos el
# application.properties de test y el e2e, que traen la suya. Si la carpeta no se puede
# crear o no deja escribir, el arranque FALLA nombrando la ruta: no hay vuelta atrás al
# directorio de trabajo.
spring.datasource.driver-class-name=org.sqlite.JDBC

# El esquema lo gobierna schema.sql (Bloque 8.5-C2a-DDL), NO Hibernate: ddl-auto
# =none. 'validate' está roto en el community SQLiteDialect 7.4.1 (valida la PK
# esperando bigint y la crea integer), por eso 'none' y no 'validate'. Nada de
# Flyway (esquema casi estático, una BD por centro).
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# Ejecuta classpath:schema.sql en cada arranque. 'always' porque SQLite no se
# detecta como BD embebida y el modo por defecto ('embedded') no lo correría.
# schema.sql es idempotente por 'create table if not exists': ya NO dropea nada
# (S109; dropear vaciaba la BD del usuario en cada arranque). Crea lo que falte y
# deja intacto lo que ya existe, datos incluidos.
spring.sql.init.mode=always

# Los ResponseStatusException llevan su reason en el 'message' del body de error
# (O-catálogo): sin esto la UI solo ve el status y no puede decir QUIÉN impide un
# borrado ni por qué se rechaza un alta. No afecta a los tests de endpoint:
# status().reason() lee getErrorMessage() del response, no los error attributes
# que gobierna esta clave.
server.error.include-message=always

# Presupuesto del solver, en segundos.
# 600 sale de la medición de S117 (35 corridas, 8 núcleos) y NO es un umbral
# seguro: la tasa de éxito acumulada a 600 s es 3/4, con un UNKNOWN y un
# FEASIBLE en dos corridas CONSECUTIVAS sobre la misma base (S118). Lo que
# decide no es el tiempo, es el azar del presolve (D-generacion-no-reproducible),
# así que subir el número compra poco y se paga en TODAS las corridas: el
# presupuesto se consume entero siempre. El fallo sale por 503 y es reintentable.
# Depende de la máquina. Para probar otro valor NO se edita este fichero
# —así acabó modificado sin commitear tras S116—: se sobreescribe en el
# arranque con --educhronos.solver.max-segundos=N
# (misma vía que ya usa el e2e para la BD, ver playwright.config.ts).
#
# PRECEDENTE: es la primera clave del espacio 'educhronos.*' y la primera
# property propia del proyecto. Se lee con un @Value suelto porque una clave no
# justifica un tipo. A la SEGUNDA clave educhronos.*, se migra a un record
# @ConfigurationProperties y este @Value desaparece.
educhronos.solver.max-segundos=600
