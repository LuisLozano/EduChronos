# Base de los tests JPA: un fichero NUEVO por contexto de Spring, en target/ (lo borra `mvn clean`).
# Antes era un fichero fijo que sobrevivía entre ejecuciones y, con `create table if not exists`,
# conservaba el esquema viejo tras cada cambio de schema.sql (S201).
spring.datasource.url=jdbc:sqlite:target/educhronos-test-${random.uuid}.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Igual que produccion (8.5-C2a-DDL): el esquema lo gobierna schema.sql, no
# Hibernate. ddl-auto=none + spring.sql.init corriendo schema.sql en cada
# contexto. schema.sql NO dropea nada desde S109 —son 21 'create table if not
# exists' y cero DROP—, asi que es idempotente: varios contextos Spring sobre
# este mismo fichero crean lo que falte y dejan intacto lo que ya existe. Quien
# deja la BD a cero es el propio test, que la borra al terminar.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.sql.init.mode=always

# Presupuesto del solver para la suite (produccion: 600 s, ver el
# application.properties de main). 5 s porque los catalogos de los tests son
# minimos y se resuelven —o se prueban infactibles— en milisegundos: la leccion
# D24/D25 es que ningun solve largo entra en la suite rapida.
educhronos.solver.max-segundos=5
