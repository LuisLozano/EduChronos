<!-- El error va FUERA de la cadena, no como su primera rama: encadenado, un 409
     de borrado se llevaría por delante la tabla (medido en S124, 8 filas → 0). -->
<!-- S226 (condición 5 de O-interfaz): caja con icono, no un <p> suelto. El icono es decorativo
     (aria-hidden): lo que se anuncia es el texto, por el role="alert" del contenedor. El texto sigue
     en un <p> para que el recuento de párrafos del spec no cambie de significado. -->
@if (error(); as texto) {
<div class="estado-lista__error" role="alert">
  <svg class="estado-lista__icono" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
    <path d="M8 1.75 15 14.25H1Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
    <line x1="8" y1="6" x2="8" y2="9.75" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="8" cy="12" r="0.9" fill="currentColor" />
  </svg>
  <p class="estado-lista__texto-error">{{ texto }}</p>
</div>
}

@switch (estado()) {
@case ('cargando') {
<p class="estado-lista__cargando">Cargando…</p>
}
@case ('vacio') {
<p class="estado-lista__vacio">{{ textoVacio() }}</p>
}
@case ('sin-resultados') {
<p class="estado-lista__sin-resultados">Ningún resultado para «{{ busqueda() }}».</p>
}
}
