<div class="grupos">
  <!-- NO lleva `!error()` (S129, `D-contador-se-apaga-con-error`): un 409 de
       borrado con la tabla llena hacía desaparecer el total. Y la condición va
       sobre la lista CARGADA, no sobre `visibles()`: con `visibles()`, una
       búsqueda sin resultados escondería el contador en vez de decir «0 de N».
       La regla vive en la decisión 5 de `styles.css`. Idéntico en las siete. -->
  <app-cabecera-lista
    titulo="Grupos"
    [total]="grupos().length"
    [coincidencias]="visibles().length"
    [mostrarContador]="!cargando() && grupos().length > 0"
    [(busqueda)]="busqueda"
    rotuloAlta="Nuevo grupo"
    (alta)="nuevo()"
  />

  <app-estado-lista
    [cargando]="cargando()"
    [error]="error()"
    [total]="grupos().length"
    [coincidencias]="visibles().length"
    [busqueda]="busqueda()"
    textoVacio="No hay grupos todavía. Crea el primero con «Nuevo grupo»."
  />

  <!-- Complemento EXACTO de la cadena de `app-estado-lista`, escrito idéntico en
       las siete listas y verificable por grep (7 coincidencias). No lleva
       `!error()`: con filas cargadas y un 409 de borrado la tabla SIGUE, que es
       la reversión medida de S124 —encadenar el error se llevaba 8 filas a 0—. -->
  @if (!cargando() && visibles().length > 0) {
    <table class="grupos__tabla">
      <thead>
        <tr>
          <th>Código</th>
          <th>Nivel</th>
          <th>Tipo</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        @for (grupo of visibles(); track grupo.id) {
          <tr>
            <td class="dato">{{ grupo.codigo }}</td>
            <td>{{ grupo.nivel }}</td>
            <td class="grupos__tipo">{{ etiquetaTipo(grupo.tipo) }}</td>
            <td class="grupos__acciones">
              <!-- Solo los ordinarios: sobre un PDC estas tres acciones acaban en un
                   error que el usuario no puede resolver. Ver el javadoc de la clase. -->
              @if (esOrdinario(grupo)) {
                <button type="button" class="grupos__editar accion-compacta" (click)="editar(grupo)">
                  Editar
                </button>
                <button type="button" class="grupos__borrar accion-destructiva accion-compacta" (click)="borrar(grupo)">
                  Borrar
                </button>
                <button type="button" class="grupos__pdc accion-compacta" (click)="pdc(grupo)">
                  PDC
                </button>
              }
              <!-- FUERA del @if a propósito: un PDC hereda el tutor de su padre al
                   crearse y tiene que poder editarlo. Ver el javadoc de la clase. -->
              <button type="button" class="grupos__tutoria accion-compacta" (click)="tutoria(grupo)">
                Tutoría
              </button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  }
</div>
