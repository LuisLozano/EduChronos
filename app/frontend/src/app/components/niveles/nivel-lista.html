<div class="niveles">
  <!-- NO lleva `!error()` (S129, `D-contador-se-apaga-con-error`): un 409 de
       borrado con la tabla llena hacía desaparecer el total. Y la condición va
       sobre la lista CARGADA, no sobre `visibles()`: con `visibles()`, una
       búsqueda sin resultados escondería el contador en vez de decir «0 de N».
       La regla vive en la decisión 5 de `styles.css`. Idéntico en las siete. -->
  <app-cabecera-lista
    titulo="Niveles"
    [total]="niveles().length"
    [coincidencias]="visibles().length"
    [mostrarContador]="!cargando() && niveles().length > 0"
    [(busqueda)]="busqueda"
    rotuloAlta="Nuevo nivel"
    (alta)="nuevo()"
  />

  <app-estado-lista
    [cargando]="cargando()"
    [error]="error()"
    [total]="niveles().length"
    [coincidencias]="visibles().length"
    [busqueda]="busqueda()"
    textoVacio="No hay niveles todavía. Crea el primero con «Nuevo nivel»: sin niveles no se pueden crear grupos."
  />

  <!-- Complemento EXACTO de la cadena de `app-estado-lista`, escrito idéntico en
       las siete listas y verificable por grep (7 coincidencias). No lleva
       `!error()`: con filas cargadas y un 409 de borrado la tabla SIGUE, que es
       la reversión medida de S124 —encadenar el error se llevaba 8 filas a 0—. -->
  @if (!cargando() && visibles().length > 0) {
  <table class="niveles__tabla">
    <thead>
    <tr>
      <th>Código</th>
      <th>Orden</th>
      <th></th>
    </tr>
    </thead>
    <tbody>
    @for (nivel of visibles(); track nivel.id) {
    <tr>
      <td>{{ nivel.codigo }}</td>
      <td>{{ nivel.orden }}</td>
      <td class="niveles__acciones">
        <button type="button" class="niveles__editar accion-compacta" (click)="editar(nivel)">
          Editar
        </button>
        <button type="button" class="niveles__borrar accion-destructiva accion-compacta" (click)="borrar(nivel)">
          Borrar
        </button>
      </td>
    </tr>
    }
    </tbody>
  </table>
  }
</div>
