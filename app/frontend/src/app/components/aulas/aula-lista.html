<div class="aulas">
  <!-- NO lleva `!error()` (S129, `D-contador-se-apaga-con-error`): un 409 de
       borrado con la tabla llena hacía desaparecer el total. Y la condición va
       sobre la lista CARGADA, no sobre `visibles()`: con `visibles()`, una
       búsqueda sin resultados escondería el contador en vez de decir «0 de N».
       La regla vive en la decisión 5 de `styles.css`. Idéntico en las siete. -->
  <app-cabecera-lista
    titulo="Aulas"
    [total]="aulas().length"
    [coincidencias]="visibles().length"
    [mostrarContador]="!cargando() && aulas().length > 0"
    [(busqueda)]="busqueda"
    rotuloAlta="Nueva aula"
    (alta)="nueva()"
  />

  <app-estado-lista
    [cargando]="cargando()"
    [error]="error()"
    [total]="aulas().length"
    [coincidencias]="visibles().length"
    [busqueda]="busqueda()"
    textoVacio="No hay aulas todavía. Crea la primera con «Nueva aula»."
  />

  <!-- Complemento EXACTO de la cadena de `app-estado-lista`, escrito idéntico en
       las siete listas y verificable por grep (7 coincidencias). No lleva
       `!error()`: con filas cargadas y un 409 de borrado la tabla SIGUE, que es
       la reversión medida de S124 —encadenar el error se llevaba 8 filas a 0—. -->
  @if (!cargando() && visibles().length > 0) {
    <table class="aulas__tabla">
      <thead>
        <tr>
          <th>Código</th>
          <th>Tipo</th>
          <th>Capacidad</th>
          <th>Edificio</th>
          <th>Planta</th>
          <th>Sector</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        @for (a of visibles(); track a.id) {
          <tr>
            <td class="dato">{{ a.codigo }}</td>
            <td>{{ a.tipo }}</td>
            <td>{{ a.capacidad ?? '—' }}</td>
            <td>{{ a.edificio ?? '—' }}</td>
            <td>{{ a.planta ?? '—' }}</td>
            <td>{{ a.sector ?? '—' }}</td>
            <td class="aulas__acciones">
              <button type="button" class="aulas__editar accion-compacta" (click)="editar(a)">
                Editar
              </button>
              <button type="button" class="aulas__borrar accion-destructiva accion-compacta" (click)="borrar(a)">
                Borrar
              </button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  }
</div>
