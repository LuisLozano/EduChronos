<section class="configuracion">
  <nav class="configuracion__indice" aria-label="Secciones de configuración">
    <h2 class="configuracion__titulo">Configuración</h2>
    <ul class="configuracion__destinos">
      @for (destino of destinos; track destino.ruta) {
        <li>
          <a
            class="configuracion__destino"
            [routerLink]="destino.ruta"
            routerLinkActive="configuracion__destino--activo"
          >
            {{ destino.titulo }}
          </a>
        </li>
      }
    </ul>
  </nav>

  <div class="configuracion__panel">
    <div class="configuracion__contenido">
      <router-outlet />
    </div>
  </div>
</section>
