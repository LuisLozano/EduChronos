<div class="subgrupos">
  <!-- NO lleva `!error()` (S129, `D-contador-se-apaga-con-error`): un 409 de
       borrado con la tabla llena hacía desaparecer el total. Y la condición va
       sobre la lista CARGADA, no sobre `visibles()`: con `visibles()`, una
       búsqueda sin resultados escondería el contador en vez de decir «0 de N».
       La regla vive en la decisión 5 de `styles.css`. Idéntico en las siete. -->
  <app-cabecera-lista
    titulo="Subgrupos"
    [total]="subgrupos().length"
    [coincidencias]="visibles().length"
    [mostrarContador]="!cargando() && subgrupos().length > 0"
    [(busqueda)]="busqueda"
    rotuloAlta="Nuevo subgrupo"
    (alta)="nuevo()"
  />

  <app-estado-lista
    [cargando]="cargando()"
    [error]="error()"
    [total]="subgrupos().length"
    [coincidencias]="visibles().length"
    [busqueda]="busqueda()"
    textoVacio="No hay subgrupos todavía. Crea el primero con «Nuevo subgrupo»."
  />

  <!-- Complemento EXACTO de la cadena de `app-estado-lista`, escrito idéntico en
       las siete listas y verificable por grep (7 coincidencias). No lleva
       `!error()`: con filas cargadas y un 409 de borrado la tabla SIGUE, que es
       la reversión medida de S124 —encadenar el error se llevaba 8 filas a 0—. -->
  @if (!cargando() && visibles().length > 0) {
    <table class="subgrupos__tabla">
      <thead>
        <tr>
          <th>Código</th>
          <th>Grupos</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        @for (subgrupo of visibles(); track subgrupo.id) {
          <tr>
            <td>{{ subgrupo.codigo }}</td>
            <td>{{ subgrupo.grupos.join(', ') }}</td>
            <td class="subgrupos__acciones">
              <button type="button" class="subgrupos__editar" (click)="editar(subgrupo)">
                Editar
              </button>
              <button type="button" class="subgrupos__borrar" (click)="borrar(subgrupo)">
                Borrar
              </button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  }
</div>
