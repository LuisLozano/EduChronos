<div class="asignaturas">
  <app-cabecera-lista
    titulo="Asignaturas"
    [total]="asignaturas().length"
    [coincidencias]="visibles().length"
    [mostrarContador]="!cargando() && !error()"
    [(busqueda)]="busqueda"
    rotuloAlta="Nueva asignatura"
    (alta)="nuevo()"
  />

  <app-estado-lista
    [cargando]="cargando()"
    [error]="error()"
    [total]="asignaturas().length"
    [coincidencias]="visibles().length"
    [busqueda]="busqueda()"
    textoVacio="No hay asignaturas todavía. Crea la primera con «Nueva asignatura»."
  />

  <!-- Complemento EXACTO de la cadena de `app-estado-lista`, escrito idéntico en
       las siete listas y verificable por grep (7 coincidencias). No lleva
       `!error()`: con filas cargadas y un 409 de borrado la tabla SIGUE, que es
       la reversión medida de S124 —encadenar el error se llevaba 8 filas a 0—. -->
  @if (!cargando() && visibles().length > 0) {
    <table class="asignaturas__tabla">
      <thead>
        <tr>
          <th>Código</th>
          <th>Nombre completo</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        @for (asig of visibles(); track asig.id) {
          <tr>
            <td>{{ asig.codigo }}</td>
            <td>{{ asig.nombreCompleto }}</td>
            <td class="asignaturas__acciones">
              <button type="button" class="asignaturas__editar" (click)="editar(asig)">
                Editar
              </button>
              <button type="button" class="asignaturas__borrar" (click)="borrar(asig)">
                Borrar
              </button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  }
</div>
