<div class="asignatura-form">
  <h2 class="asignatura-form__titulo">
    {{ esEdicion ? 'Editar asignatura' : 'Nueva asignatura' }}
  </h2>

  <form [formGroup]="form" (ngSubmit)="guardar()">
    <label class="asignatura-form__campo">
      <span class="asignatura-form__etiqueta">Código corto</span>
      <input type="text" formControlName="codigoCorto" class="asignatura-form__input" />
      @if (form.controls.codigoCorto.touched && form.controls.codigoCorto.invalid) {
        <span class="asignatura-form__error">El código corto es obligatorio.</span>
      }
    </label>

    <label class="asignatura-form__campo">
      <span class="asignatura-form__etiqueta">Nivel</span>
      <select formControlName="nivel" class="asignatura-form__input">
        <option value="">— sin nivel —</option>
        @for (n of niveles(); track n.id) {
          <option [value]="n.codigo">{{ n.codigo }}</option>
        }
      </select>
    </label>

    <label class="asignatura-form__campo">
      <span class="asignatura-form__etiqueta">Nombre completo</span>
      <input type="text" formControlName="nombreCompleto" class="asignatura-form__input" />
      @if (form.controls.nombreCompleto.touched && form.controls.nombreCompleto.invalid) {
        <span class="asignatura-form__error">El nombre es obligatorio.</span>
      }
    </label>

    <p class="asignatura-form__codigo">
      Código de la asignatura: <span class="dato">{{ codigoResultante() || '—' }}</span>
    </p>

    @if (error()) {
      <p class="asignatura-form__error-servidor" role="alert">{{ error() }}</p>
    }

    <div class="asignatura-form__acciones">
      <button type="button" class="asignatura-form__cancelar" (click)="cancelar()">
        Cancelar
      </button>
      <button type="submit" class="asignatura-form__guardar accion-principal" [disabled]="guardando()">
        Guardar
      </button>
    </div>
  </form>
</div>
