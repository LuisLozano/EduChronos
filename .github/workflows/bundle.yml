# Construye el bundle de Windows de Educhronos: el job linux ejecuta empaquetar-linux.sh
# (jar, JDK de Windows y huella del jar), el job windows ejecuta empaquetar-windows.ps1 sobre
# esa entrega, y con un tag v* el job publicar sube el zip y su .sha256 a la Release del tag.
# Es la vía principal de la condición 3 de O-ci; la manual de docs/empaquetado.md queda de respaldo.
# La huella del jar viaja como salida del job linux y no dentro del artefacto (decisión D de
# O-ci): conserva la defensa de S156, la huella llega por un canal distinto de la entrega.
# -SinHumo es deliberado (decisión de S174): la condición 3 no pide humo, y el arranque del
# bundle lo cubre la condición 4.
name: bundle

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      huella: ${{ steps.huella.outputs.huella }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Empaquetar (lado Linux)
        shell: bash
        # Con un tag v*, el jar lleva su versión (S192): v1.2.3 → --version 1.2.3. Sin tag, la
        # del pom. El script valida el formato y sale con 2 si el tag no es X.Y.Z[-sufijo].
        run: |
          version=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version=(--version "${GITHUB_REF_NAME#v}")
          fi
          scripts/empaquetar-linux.sh --salida "$RUNNER_TEMP/entrega" "${version[@]}"

      - name: Huella del jar
        id: huella
        shell: bash
        run: |
          sumas="$RUNNER_TEMP/entrega/build/SHA256SUMS"
          n=$(awk '$2 ~ /\.jar$/ { n++ } END { print n+0 }' "$sumas")
          if [ "$n" -ne 1 ]; then
            echo "::error::SHA256SUMS tiene $n lineas de .jar; se esperaba exactamente 1."
            cat "$sumas"
            exit 1
          fi
          huella=$(awk '$2 ~ /\.jar$/ { print $1 }' "$sumas")
          if ! printf '%s' "$huella" | grep -qE '^[0-9a-f]{64}$'; then
            echo "::error::la huella del jar no son 64 hexadecimales en minusculas: '$huella'"
            exit 1
          fi
          echo "huella del jar: $huella"
          echo "huella=$huella" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: entrega
          path: ${{ runner.temp }}/entrega
          retention-days: 1
          if-no-files-found: error

  windows:
    runs-on: windows-2025-vs2026
    needs: linux
    timeout-minutes: 40
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: entrega
          path: ${{ runner.temp }}\entrega

      - name: Empaquetar (lado Windows, -SinHumo)
        shell: powershell
        env:
          HUELLA_JAR: ${{ needs.linux.outputs.huella }}
        run: |
          Set-Location "$env:RUNNER_TEMP\entrega\build"
          powershell -ExecutionPolicy Bypass -File .\empaquetar-windows.ps1 -Base "$env:RUNNER_TEMP\educhronos-build" -HuellaJar $env:HUELLA_JAR -SinHumo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Comprobar el zip y su .sha256
        shell: powershell
        run: |
          $zip = "$env:RUNNER_TEMP\educhronos-build\Educhronos-win.zip"
          $sha = "$zip.sha256"
          if (-not (Test-Path $zip)) { Write-Host "::error::falta $zip"; exit 1 }
          if (-not (Test-Path $sha)) { Write-Host "::error::falta $sha"; exit 1 }
          # Se compara byte a byte con la linea esperada: hash, formato sha256sum, LF y sin BOM.
          $medido = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          $esperado = "$medido  Educhronos-win.zip`n"
          $leido = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($sha))
          if ($leido -cne $esperado) {
              Write-Host "::error::el .sha256 no casa con el zip"
              Write-Host ("  esperado: [{0}]" -f $esperado)
              Write-Host ("  leido   : [{0}]" -f $leido)
              exit 1
          }
          Write-Host "zip y .sha256 coinciden: $medido"

      - uses: actions/upload-artifact@v7
        with:
          name: bundle-windows
          path: |
            ${{ runner.temp }}/educhronos-build/Educhronos-win.zip
            ${{ runner.temp }}/educhronos-build/Educhronos-win.zip.sha256
          retention-days: 7
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: transcripcion
          path: ${{ runner.temp }}/educhronos-build/empaquetado-*.txt
          retention-days: 7
          if-no-files-found: warn

  publicar:
    runs-on: ubuntu-24.04
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: bundle-windows

      - name: Verificar el zip
        shell: bash
        run: sha256sum -c Educhronos-win.zip.sha256

      - name: Crear la Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          extra=()
          case "$GITHUB_REF_NAME" in
            *-*) extra+=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" Educhronos-win.zip Educhronos-win.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "Educhronos ${GITHUB_REF_NAME#v}" \
            --notes "Bundle de Windows construido por CI desde $GITHUB_SHA." "${extra[@]}"
