name: tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java:
    name: mvn test (solver + app)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: mvn test
        run: mvn -B test

  vitest:
    name: vitest (ng test)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: app/frontend/.nvmrc
          package-manager-cache: false
      - name: npm 11.21.1 (packageManager)
        run: npm install -g npm@11.21.1
      - name: npm ci
        run: npm ci
      - name: ng test
        run: npm test -- --watch=false

  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v7
        with:
          node-version-file: app/frontend/.nvmrc
          package-manager-cache: false
      - name: npm 11.21.1 (packageManager)
        run: npm install -g npm@11.21.1
      # El backend del e2e arranca con `mvn -pl app spring-boot:run` (sin -am), que resuelve el
      # solver desde ~/.m2. En un runner limpio no está: se instala el solver y su pom padre.
      - name: Instalar el solver en ~/.m2
        run: mvn -B -pl solver -am install -DskipTests
      # Descarga las dependencias de app y compila fuera del webServer, cuyo timeout (120 s) debe
      # medir sólo el arranque del backend, no la descarga de Maven.
      - name: Compilar app
        run: mvn -B -pl app test-compile
      - name: npm ci
        working-directory: app/frontend
        run: npm ci
      - name: Navegador de Playwright
        working-directory: app/frontend
        run: npx playwright install --with-deps chromium
      - name: e2e
        working-directory: app/frontend
        run: npm run e2e
      - name: Traza del fallo
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-traza
          path: app/frontend/test-results/
          retention-days: 7

  docs:
    name: rutas de docs/tecnica
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Python
        run: python3 --version
      - name: Tests del comprobador
        run: python3 -B -m unittest discover -s tools/doc-tecnica/tests -p 'test_*.py'
      - name: Comprobar rutas
        run: python3 -B tools/doc-tecnica/comprobar_rutas.py --raiz "$GITHUB_WORKSPACE"
